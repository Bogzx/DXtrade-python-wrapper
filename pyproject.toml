[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dxtrade-python-wrapper"
dynamic = ["version"]
description = "Python client for the DXtrade REST and Push APIs (spec-conformant, not live-verified)"
readme = "README.MD"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bogdan Truta" }]
keywords = ["dxtrade", "devexperts", "trading", "broker", "api", "prop-firm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25",
    "websocket-client>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.23", "jsonschema>=4", "websockets>=12"]
examples = ["python-dotenv>=0.19"]

[project.urls]
Homepage = "https://github.com/Bogzx/DXtrade-python-wrapper"
"DXtrade API docs" = "https://demo.dx.trade/developers/"

[tool.setuptools]
packages = ["dxtrade_wrapper"]

[tool.setuptools.dynamic]
version = { attr = "dxtrade_wrapper.__version__" }

[tool.setuptools.package-data]
dxtrade_wrapper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
