name: Release

# Runs when a GitHub release is published (e.g. `gh release create v0.2.0`).
# It always builds, checks and attaches the sdist and wheel to the release.
# Uploading to TestPyPI and then PyPI happens only once the repository variable
# PYPI_PUBLISH is "true", i.e. after Trusted Publishing has been configured on
# test.pypi.org and pypi.org for this workflow (see README "Packaging").

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches __version__ and has a dated CHANGELOG entry
        run: python scripts/check_release.py "${{ github.event.release.tag_name }}"
      - run: pip install build twine && python -m build
      - run: twine check --strict dist/*
      - name: Test the sdist
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/*/
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install -q ".[test]"
          /tmp/sdist-venv/bin/python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the sdist and wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"

  publish-testpypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dxtrade-python-wrapper
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a re-run must not fail on the version it already uploaded

  publish-pypi:
    needs: publish-testpypi
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dxtrade-python-wrapper
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
