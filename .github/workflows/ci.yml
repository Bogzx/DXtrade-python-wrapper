name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" ruff
      - run: ruff check .
      - run: python -m pytest -q

  spec-conformance:
    # Downloads Devexperts' public OpenAPI document (read-only) and checks the
    # client's requests and the test fixtures against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]" mypy types-requests
      - run: mypy dxtrade_wrapper
      - run: DXTRADE_SPEC_TESTS=1 python -m pytest tests/test_spec_conformance.py -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_release.py
      - run: pip install build twine && python -m build
      - run: twine check --strict dist/*
      # The sdist must be self-contained: unpack it and run its own test suite.
      - name: Test the sdist
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/*/
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install -q ".[test]"
          /tmp/sdist-venv/bin/python -m pytest -q
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -q dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/python -c "
          import importlib.resources, dxtrade_wrapper
          assert importlib.resources.files('dxtrade_wrapper').joinpath('py.typed').is_file()
          print(dxtrade_wrapper.__version__, dxtrade_wrapper.DXTradeClient)"
